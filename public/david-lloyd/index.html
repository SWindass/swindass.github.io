<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>David Lloyd Club Finder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --bg: #f3ede0;
  --panel: #fbf8f1;
  --panel-edge: #d9cfbb;
  --fg: #1b2733;
  --fg-dim: #4a5563;
  --muted: #7a7366;
  --pin: #004735;
  --pin-ring: #ffffff;
  --pin-hover: #c33a2e;
  --pin-active: #e08a1f;
  --pin-mine: #f0a830;
  --pin-mine-ring: #7a3f00;
  --pr-pin: #2b4b9e;
  --pr-pin-mine: #e63aa2;
  --pr-pin-mine-ring: #5a0a3a;
  --pi-pin: #6a2b9f;
  --pi-pin-mine: #65bc46;
  --pi-pin-mine-ring: #1e3f10;
  --accent: #004735;
  --shadow: 0 1px 2px rgba(23,30,40,0.08), 0 4px 14px rgba(23,30,40,0.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1620;
    --panel: #121c28;
    --panel-edge: #223040;
    --fg: #e8ecf1;
    --fg-dim: #b3bdc9;
    --muted: #8b96a3;
    --pin: #58d1b1;
    --pin-ring: #0b141d;
    --pin-hover: #ff7a65;
    --pin-active: #ffd166;
    --pin-mine: #ffb547;
    --pin-mine-ring: #2a1a00;
    --pr-pin: #7c9eff;
    --pr-pin-mine: #ff78c2;
    --pr-pin-mine-ring: #4a0030;
    --pi-pin: #b48be0;
    --pi-pin-mine: #93d680;
    --pi-pin-mine-ring: #1a3a0a;
    --accent: #58d1b1;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 22px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1620;
  --panel: #121c28;
  --panel-edge: #223040;
  --fg: #e8ecf1;
  --fg-dim: #b3bdc9;
  --muted: #8b96a3;
  --pin: #58d1b1;
  --pin-ring: #0b141d;
  --pin-hover: #ff7a65;
  --pin-active: #ffd166;
  --pin-mine: #ffb547;
  --pin-mine-ring: #2a1a00;
  --pr-pin: #7c9eff;
  --pr-pin-mine: #ff78c2;
  --pr-pin-mine-ring: #4a0030;
  --pi-pin: #b48be0;
  --pi-pin-mine: #93d680;
  --pi-pin-mine-ring: #1a3a0a;
  --accent: #58d1b1;
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 22px rgba(0,0,0,0.35);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.4;
  overflow: hidden;
}

.app {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-columns: 320px 1fr;
  grid-template-rows: 1fr;
}

#map { grid-column: 2; background: var(--bg); position: relative; min-width: 0; }

.panel {
  grid-column: 1;
  background: var(--panel);
  border-right: 1px solid var(--panel-edge);
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
.panel-head { padding: 18px 18px 14px; border-bottom: 1px solid var(--panel-edge); }
.brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.brand h1 {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 600; font-size: 20px; margin: 0;
  letter-spacing: -0.01em; color: var(--fg);
}
.brand .pin { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }
.subtitle { color: var(--muted); font-size: 12px; letter-spacing: 0.02em; text-transform: uppercase; }
.count { color: var(--fg-dim); font-size: 12px; margin-top: 10px; }
.count b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

.search { margin: 10px 0 2px; position: relative; }
.search input {
  width: 100%; box-sizing: border-box;
  padding: 9px 12px 9px 32px;
  border: 1px solid var(--panel-edge);
  border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; outline: none;
}
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--muted); }

.sections { overflow-y: auto; flex: 1; min-height: 0; }
.section { border-bottom: 1px solid var(--panel-edge); }
.section:last-child { border-bottom: none; }
.section-header {
  width: 100%; display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  background: color-mix(in srgb, var(--panel-edge) 25%, var(--panel));
  border: none; border-bottom: 1px solid var(--panel-edge);
  color: var(--fg); font: inherit; font-weight: 600; font-size: 13px;
  text-align: left; cursor: pointer;
  position: sticky; top: 0; z-index: 2;
}
.section-header:hover { background: color-mix(in srgb, var(--panel-edge) 45%, var(--panel)); }
.section-header .chev {
  width: 10px; height: 10px;
  border-right: 2px solid var(--fg-dim);
  border-bottom: 2px solid var(--fg-dim);
  transform: rotate(45deg);
  transition: transform 0.15s ease;
  margin-right: 2px;
}
.section.collapsed-section .section-header .chev { transform: rotate(-45deg); }
.section-header .dot-dl { background: var(--pin); border: 1.5px solid var(--pin-ring); box-shadow: 0 0 0 1px var(--panel-edge); }
.section-header .dot-pr { background: var(--pr-pin); border: 1.5px solid var(--pin-ring); box-shadow: 0 0 0 1px var(--panel-edge); }
.section-header .dot-pi { background: var(--pi-pin); border: 1.5px solid var(--pin-ring); box-shadow: 0 0 0 1px var(--panel-edge); }
.section-header .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
.section-header .label { flex: 1; }
.section-header .section-count {
  font-weight: 500; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums;
}
.section-header .section-count b { color: var(--fg-dim); font-weight: 600; }
.section-eye {
  background: transparent;
  border: 1px solid var(--panel-edge);
  color: var(--fg-dim);
  width: 28px; height: 24px; border-radius: 5px;
  padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex: 0 0 auto;
}
.section-eye:hover { background: var(--bg); color: var(--fg); }
.section-eye svg { width: 14px; height: 14px; }
.section-eye.hidden-eye {
  color: var(--muted);
  background: color-mix(in srgb, var(--muted) 10%, transparent);
}
.section-body { padding: 4px 8px 10px; }
.section.collapsed-section .section-body { display: none; }
.club-list { padding: 0; }
.club {
  padding: 10px 10px; border-radius: 7px; cursor: pointer;
  display: grid; grid-template-columns: 20px 1fr; align-items: start; gap: 8px;
  border: 1px solid transparent;
}
.club:hover, .club:focus-visible { background: color-mix(in srgb, var(--accent) 8%, transparent); outline: none; }
.club.active { background: color-mix(in srgb, var(--accent) 14%, transparent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.club.mine { background: color-mix(in srgb, var(--pin-mine) 10%, transparent); }
.club.mine.active { background: color-mix(in srgb, var(--pin-mine) 18%, transparent); border-color: color-mix(in srgb, var(--pin-mine) 45%, transparent); }
.club-check {
  appearance: none;
  width: 16px; height: 16px;
  border: 1.5px solid var(--panel-edge);
  border-radius: 4px;
  background: var(--bg);
  cursor: pointer;
  margin: 2px 0 0;
  display: inline-block;
  position: relative;
  flex: 0 0 auto;
}
.club-check:hover { border-color: var(--pin-mine); }
.club-check:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset: 1px; }
.club-check:checked {
  background: var(--pin-mine);
  border-color: var(--pin-mine);
}
.club-check:checked::after {
  content: "";
  position: absolute;
  left: 4px; top: 1px;
  width: 4px; height: 8px;
  border: solid var(--pin-mine-ring);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.club-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.club .name { font-weight: 600; color: var(--fg); font-size: 13.5px; }
.club .addr { color: var(--fg-dim); font-size: 12px; }
.club .pc { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.empty { padding: 20px; color: var(--muted); text-align: center; font-size: 12.5px; }

.selection-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border-top: 1px solid var(--panel-edge);
  border-bottom: 1px solid var(--panel-edge);
  background: color-mix(in srgb, var(--pin-mine) 7%, var(--panel));
  font-size: 12px;
  color: var(--fg-dim);
}
.selection-bar .dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--pin-mine);
  border: 1.5px solid var(--pin-mine-ring);
  display: inline-block;
  flex: 0 0 auto;
}
.selection-bar b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.selection-bar .spacer { flex: 1; }
.selection-bar button {
  background: transparent;
  border: 1px solid var(--panel-edge);
  color: var(--fg-dim);
  padding: 3px 9px;
  border-radius: 5px;
  font: inherit;
  font-size: 11.5px;
  cursor: pointer;
}
.selection-bar button:hover { background: var(--bg); color: var(--fg); }
.selection-bar button:disabled { opacity: 0.4; cursor: default; }

.map-overlay { position: absolute; z-index: 500; pointer-events: none; }
.map-buttons { top: 14px; right: 14px; pointer-events: auto; display: flex; gap: 8px; }
.map-buttons button {
  background: var(--panel); border: 1px solid var(--panel-edge); color: var(--fg);
  width: 36px; height: 36px; border-radius: 50%;
  box-shadow: var(--shadow); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; padding: 0;
}
.map-buttons button:hover { background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
.legend {
  bottom: 14px; left: 14px;
  background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 8px;
  padding: 8px 10px; box-shadow: var(--shadow); font-size: 11.5px; color: var(--fg-dim); pointer-events: auto;
}
.legend-row { display: flex; align-items: center; gap: 7px; }
.legend-row + .legend-row { margin-top: 4px; }
.swatch-pin {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--pin); border: 1.5px solid var(--pin-ring);
  box-shadow: 0 0 0 1px var(--panel-edge);
}
.swatch-pin.pr { background: var(--pr-pin); }
.swatch-pin.pi { background: var(--pi-pin); }
.swatch-pin-mine {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--pin-mine); border: 1.5px solid var(--pin-mine-ring);
  box-shadow: 0 0 0 1px var(--panel-edge);
}

/* Leaflet overrides */
.leaflet-container { font-family: inherit; }
.leaflet-control-zoom a {
  background: var(--panel) !important;
  color: var(--fg) !important;
  border: 1px solid var(--panel-edge) !important;
  box-shadow: var(--shadow);
}
.leaflet-control-zoom a:hover { background: color-mix(in srgb, var(--accent) 10%, var(--panel)) !important; }
.leaflet-control-attribution {
  background: color-mix(in srgb, var(--panel) 90%, transparent) !important;
  color: var(--muted) !important;
  font-size: 10.5px !important;
}
.leaflet-tooltip {
  background: var(--panel); color: var(--fg);
  border: 1px solid var(--panel-edge); border-radius: 7px;
  box-shadow: var(--shadow); padding: 8px 10px;
  font-family: inherit; font-size: 12.5px;
  white-space: normal; max-width: 240px;
}
.leaflet-tooltip::before { display: none; }
.leaflet-tooltip-top { margin-top: -8px; }
.tt-name { font-weight: 600; color: var(--fg); display: block; margin-bottom: 2px; }
.tt-addr { color: var(--fg-dim); font-size: 12px; }
.tt-pc { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; letter-spacing: 0.03em; margin-top: 2px; display: block; }
.tt-book {
  display: inline-block;
  margin-top: 8px;
  padding: 5px 10px;
  background: var(--pi-pin, #52329a);
  color: #fff !important;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
}
.tt-book:hover { filter: brightness(1.1); text-decoration: none; }
.tt-book.tt-pr { background: var(--pr-pin, #e6007e); }

/* Permanent pin labels — shown when zoomed in. */
.pin-label {
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  color: var(--fg);
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 500;
  line-height: 1.3;
  white-space: nowrap;
  border: 1px solid var(--panel-edge);
  box-shadow: 0 1px 2px rgba(0,0,0,0.15);
  pointer-events: none;
  text-shadow: 0 0 2px var(--panel);
}
.pin-label-dl { color: var(--pin); border-color: color-mix(in srgb, var(--pin) 40%, var(--panel-edge)); }
.pin-label-pr { color: var(--pr-pin); border-color: color-mix(in srgb, var(--pr-pin) 40%, var(--panel-edge)); }
.pin-label-pi { color: var(--pi-pin); border-color: color-mix(in srgb, var(--pi-pin) 40%, var(--panel-edge)); }

.leaflet-popup-content-wrapper { background: var(--panel); color: var(--fg); border-radius: 8px; box-shadow: var(--shadow); border: 1px solid var(--panel-edge); }
.leaflet-popup-tip { background: var(--panel); border: 1px solid var(--panel-edge); }
.leaflet-popup-content { margin: 10px 12px; font-size: 13px; }
.leaflet-popup-close-button { color: var(--muted) !important; }

/* Tiles swap by URL (CARTO light vs dark), no CSS filter needed */

.panel-toggle { display: none; }
@media (max-width: 720px) {
  /* Map-first mobile layout: slim top bar + full-bleed map + optional slide-up sheet */
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  #map { grid-column: 1; grid-row: 2; }
  .panel {
    grid-column: 1; grid-row: 1;
    border-right: none;
    border-bottom: 1px solid var(--panel-edge);
    max-height: none;
  }
  /* Default (collapsed) state: compact top bar only */
  .panel:not(.expanded) .brand,
  .panel:not(.expanded) .subtitle,
  .panel:not(.expanded) .count,
  .panel:not(.expanded) .selection-bar,
  .panel:not(.expanded) .sections { display: none; }
  .panel-head { padding: 8px 10px; border-bottom: none; display: flex; align-items: center; gap: 8px; }
  .search { flex: 1 1 auto; margin: 0; }
  .search input { padding: 7px 10px 7px 28px; font-size: 13px; }
  .search svg { left: 8px; width: 12px; height: 12px; }

  .panel-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 32px;
    background: transparent; border: 1px solid var(--panel-edge);
    color: var(--fg-dim); padding: 0; border-radius: 7px;
    font: inherit; font-size: 11px; cursor: pointer;
    flex: 0 0 auto;
    order: 2;
    position: relative;
  }
  .panel-toggle svg { width: 18px; height: 18px; }
  .panel-toggle .icon-close { display: none; }
  .panel.expanded .panel-toggle .icon-open { display: none; }
  .panel.expanded .panel-toggle .icon-close { display: block; }

  /* Expanded state: slide-up drawer that overlays the map */
  .panel.expanded {
    position: fixed;
    top: 50px; left: 0; right: 0; bottom: 0;
    z-index: 500;
    display: flex; flex-direction: column;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.25);
  }
  .panel.expanded .panel-head {
    padding: 10px 12px 10px;
    border-bottom: 1px solid var(--panel-edge);
    flex-wrap: wrap;
  }
  .panel.expanded .brand { flex: 1 1 auto; margin: 0; }
  .panel.expanded .brand h1 { font-size: 17px; }
  .panel.expanded .subtitle { display: none; }
  .panel.expanded .search { flex: 1 1 100%; margin-top: 6px; }
  .panel.expanded .count { display: none; }
  .panel.expanded .selection-bar { padding: 6px 12px; font-size: 11px; }
  .panel.expanded .sections { flex: 1 1 auto; overflow-y: auto; min-height: 0; }

  /* Compact sections on mobile */
  .section-header {
    padding: 7px 10px; font-size: 12px; gap: 6px;
    position: static;
  }
  .section-header .label { font-size: 12px; }
  .section-header .section-count { font-size: 10.5px; }
  .section-eye { width: 24px; height: 22px; }
  .section-eye svg { width: 12px; height: 12px; }
  .section-body { padding: 2px 6px 6px; }
  .club { padding: 7px 8px; gap: 6px; }
  .club .name { font-size: 12.5px; }
  .club .addr { font-size: 11px; }
  .club .pc { font-size: 10.5px; }

  /* Push floating controls below the slim top bar so they don't clash with the toggle */
  .map-buttons { top: 60px; right: 8px; }
  .map-buttons button { width: 32px; height: 32px; }
  .leaflet-control-zoom { margin-top: 58px !important; }
  .legend { display: none; }
  /* When the drawer is open, tuck away the map-side overlays and Leaflet controls */
  .panel.expanded ~ .map-buttons,
  .panel.expanded ~ #map .leaflet-control-zoom { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel" id="panel">
    <div class="panel-head">
      <div class="brand">
        <span class="pin"></span>
        <h1>David Lloyd Clubs</h1>
      </div>
      <button class="panel-toggle" type="button" id="panelToggle" aria-expanded="false" aria-label="Open list">
        <svg class="icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M6 18L18 6"/></svg>
      </button>
      <div class="subtitle">UK club finder</div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchBox" type="search" placeholder="Search by town, name or postcode" autocomplete="off">
      </div>
      <div class="count">Tick the box for each venue available to you. Hover any pin for details.</div>
    </div>
    <div class="selection-bar" id="selectionBar">
      <span class="dot" aria-hidden="true"></span>
      <span><b id="countMine">0</b> selected</span>
      <span class="spacer"></span>
      <button type="button" id="clearMine" disabled>Clear all</button>
    </div>
    <div class="sections">
      <div class="section" id="section-dl">
        <button type="button" class="section-header" data-section="dl" aria-expanded="true">
          <span class="chev" aria-hidden="true"></span>
          <span class="dot dot-dl" aria-hidden="true"></span>
          <span class="label">David Lloyd Gyms</span>
          <span class="section-count"><b id="dlShown">0</b>/<b id="dlTotal">0</b></span>
          <span class="section-eye" id="eye-dl" role="button" tabindex="0" title="Show/hide gym pins on map" aria-pressed="true"></span>
        </button>
        <div class="section-body">
          <div class="club-list" id="clubList"></div>
        </div>
      </div>
      <div class="section collapsed-section" id="section-pr">
        <button type="button" class="section-header" data-section="pr" aria-expanded="false">
          <span class="chev" aria-hidden="true"></span>
          <span class="dot dot-pr" aria-hidden="true"></span>
          <span class="label">Park Runs</span>
          <span class="section-count"><b id="prShown">0</b>/<b id="prTotal">0</b></span>
          <span class="section-eye" id="eye-pr" role="button" tabindex="0" title="Show/hide parkrun pins on map" aria-pressed="true"></span>
        </button>
        <div class="section-body">
          <div class="club-list" id="prList"></div>
        </div>
      </div>
      <div class="section collapsed-section" id="section-pi">
        <button type="button" class="section-header" data-section="pi" aria-expanded="false">
          <span class="chev" aria-hidden="true"></span>
          <span class="dot dot-pi" aria-hidden="true"></span>
          <span class="label">Premier Inn Hotels</span>
          <span class="section-count"><b id="piShown">0</b>/<b id="piTotal">0</b></span>
          <span class="section-eye" id="eye-pi" role="button" tabindex="0" title="Show/hide Premier Inn pins on map" aria-pressed="true"></span>
        </button>
        <div class="section-body">
          <div class="club-list" id="piList"></div>
        </div>
      </div>
    </div>
  </aside>
  <div id="map"></div>
  <div class="map-overlay map-buttons">
    <button type="button" id="zoomAll" title="Zoom to whole UK" aria-label="Zoom to whole UK">

const STORAGE_KEYS = { dl: 'dl-mine', pr: 'pr-mine', pi: 'pi-mine' };

function toggleMine(type, i, picked) {
  const data = dataFor(type);
  const set = mineSetFor(type);
  const key = keyFor(type, data[i]);
  if (picked) set.add(key); else set.delete(key);
  try { localStorage.setItem(STORAGE_KEYS[type], JSON.stringify([...set])); } catch (_) {}

    m.setStyle(pinStyle(type, stateFor(type, i), picked));
    if (picked) m.bringToFront();

  const row = listEls[type].querySelector('.club[data-idx="' + i + '"]');

  const filteringOn = mineSetFor(type).size > 0;
  pins.forEach((m, i) => {
    const show = !filteringOn || isMine(type, i);
    const inLayer = layer.hasLayer(m);
    if (show && !inLayer) layer.addLayer(m);
    else if (!show && inLayer) layer.removeLayer(m);
  });

function normalize(s) { return (s || '').toLowerCase(); }

searchEl.addEventListener('input', () => {

    filtered.pi = PREMIER_INNS.map((_, i) => i);
  } else {
    filtered.dl = [];
    CLUBS.forEach((c, i) => {
      const hay = normalize(c.name) + ' ' + normalize(c.address) + ' ' + normalize(c.postcode);
      if (hay.includes(q)) filtered.dl.push(i);
    });
    filtered.pr = [];
    PARKRUNS.forEach((p, i) => {
      const hay = normalize(p.n) + ' ' + normalize(p.l);
      if (hay.includes(q)) filtered.pr.push(i);
    });
    filtered.pi = [];
    PREMIER_INNS.forEach((h, i) => {
      const hay = normalize(h.name) + ' ' + normalize(h.address) + ' ' + normalize(h.postcode);
      if (hay.includes(q)) filtered.pi.push(i);

const geocodeCache = new Map();
let geocodeAbort = null;
async function geocodeUKPlace(q) {
  const key = q.toLowerCase();
  if (geocodeCache.has(key)) return geocodeCache.get(key);
  try {
    if (geocodeAbort) geocodeAbort.abort();
    geocodeAbort = new AbortController();
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&countrycodes=gb&limit=1`;
    const resp = await fetch(url, { signal: geocodeAbort.signal, headers: { 'Accept-Language': 'en' } });
    if (!resp.ok) return null;
    const data = await resp.json();
    const result = (data && data[0]) ? data[0] : null;
    geocodeCache.set(key, result);
    return result;
  } catch (e) {
    return null;
  }
}

async function zoomToSearchResults() {
  const raw = searchEl.value.trim();
  if (!raw) {
    // Empty search: snap back to the full UK view.
    map.flyToBounds(UK_BOUNDS, { padding: [20, 20], duration: 0.5 });
    return;
  }
  // Try to geocode the typed place — city, town, postcode — and fly there.
  const place = await geocodeUKPlace(raw);
  // Bail if the user has moved on to a different query since we started.
  if (searchEl.value.trim() !== raw) return;
  if (place && place.boundingbox) {
    const [latMin, latMax, lngMin, lngMax] = place.boundingbox.map(parseFloat);
    const bounds = L.latLngBounds([latMin, lngMin], [latMax, lngMax]);
    map.flyToBounds(bounds, { padding: [20, 20], maxZoom: 14, duration: 0.6 });
    return;
  }
  // Fallback: no geocoding result — fit the matching pins instead.
  const latlngs = [];
  if (typeVisible.dl) filtered.dl.forEach(i => latlngs.push([CLUBS[i].lat, CLUBS[i].lng]));
  if (typeVisible.pr) filtered.pr.forEach(i => latlngs.push([PARKRUNS[i].lat, PARKRUNS[i].lng]));
  if (typeVisible.pi) filtered.pi.forEach(i => latlngs.push([PREMIER_INNS[i].lat, PREMIER_INNS[i].lng]));
  if (latlngs.length === 0) return;
  if (latlngs.length === 1) {
    map.flyTo(latlngs[0], 14, { duration: 0.5 });
    return;
  }
  map.flyToBounds(L.latLngBounds(latlngs), { padding: [20, 20], maxZoom: 13, duration: 0.5 });
}

const themeIcon = document.getElementById('themeIcon');
function currentTheme() {
  const explicit = document.documentElement.getAttribute('data-theme');
  if (explicit) return explicit;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function renderThemeIcon() {
  const t = currentTheme();
  themeIcon.innerHTML = t === 'dark'
    ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
}
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('dl-theme', t); } catch (_) {}
  dlPinByIdx.forEach((m, i) => m.setStyle(pinStyle('dl', stateFor('dl', i), isMine('dl', i))));
  prPinByIdx.forEach((m, i) => m.setStyle(pinStyle('pr', stateFor('pr', i), isMine('pr', i))));
  piPinByIdx.forEach((m, i) => m.setStyle(pinStyle('pi', stateFor('pi', i), isMine('pi', i))));
  applyTileTheme(t);
  renderThemeIcon();
}
themeBtn.addEventListener('click', () => setTheme(currentTheme() === 'dark' ? 'light' : 'dark'));
try {
  const saved = localStorage.getItem('dl-theme');
  if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
} catch (_) {}
applyTileTheme(currentTheme());
renderThemeIcon();

document.getElementById('zoomAll').addEventListener('click', () => {
  if (active) {
    const pm = pinByIdx(active.type, active.idx);
    if (pm) pm.setStyle(pinStyle(active.type, 'default', isMine(active.type, active.idx)));
  }
  active = null;
  map.closePopup();
  renderList();
  map.flyToBounds(UK_BOUNDS, { padding: [20, 20], duration: 0.6 });
});

if (window.innerWidth <= 720) {
  // Mobile defaults: panel collapsed to the slim top bar, map takes the viewport.
  panelEl.classList.remove('expanded');
  panelToggle.setAttribute('aria-expanded', 'false');
  panelToggle.setAttribute('aria-label', 'Open list');
}

renderList();
updateSelectionBar();
applyMineFilter('dl');
applyMineFilter('pr');
applyMineFilter('pi');
</script>
</body>
</html>
